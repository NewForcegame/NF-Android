plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfsdk.demo'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        // applicationId của game test — đổi theo game thật
        applicationId 'com.nfsdk.demo'
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 1
        versionName rootProject.ext.nfsdkVersion
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled true   // kiểm consumer-rules.pro của SDK
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation files('libs/nfsdk-1.0.1.aar')
    // .aar trần không kéo phụ thuộc bắc cầu ⇒ thêm tay phụ thuộc bắt buộc của SDK
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.annotation:annotation:1.9.1'

    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.appsflyer:af-android-sdk:6.18.1'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.facebook.android:facebook-login:19.0.1'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.play:review:2.0.2'
}
